/* ---------------- event binding ---------------- */
function bindGlobal(){
  root.querySelectorAll("[data-nav]").forEach(el=>{
    el.onclick = ()=>{ state.navTab = el.dataset.nav; state.view = el.dataset.nav; render(); };
  });
  root.querySelectorAll("[data-action]").forEach(el=>{
    const action = el.dataset.action;
    if(action==="back"){ el.onclick = ()=>{
      if(state.view==="customer-profile"){ state.view="customer-search"; }
      else { state.view = state.currentUser.role==="admin"?"admin":"home"; state.navTab=state.view; }
      render();
    }; }
    if(action==="logout"){ el.onclick = doLogout; }
    if(action==="open-detail"){ el.onclick = ()=>{ state.selectedOrderId = el.dataset.id; state.view="detail"; render(); }; }
    if(action==="start-trip"){ el.onclick = startTrip; }
    if(action==="open-end-trip"){ el.onclick = async ()=>{ state.modal={type:"end-trip"}; await render();
      const trip = await activeTripFor(state.currentUser.id);
      if(trip) document.getElementById("mo-end-odo").value = trip.startOdo + 45;
    }; }
    if(action==="confirm-end-trip"){ el.onclick = ()=>{
      const v = parseFloat(document.getElementById("mo-end-odo").value);
      if(!v){ showToast("주행거리를 입력해주세요."); return; }
      endTripWithOdo(v);
    }; }
    if(action==="open-fuel"){ el.onclick = async ()=>{ state.modal={type:"fuel"}; await render(); setupFuelAutoCalc();
      const odo = await currentOdometer(state.currentUser.vehicleNo);
      document.getElementById("mo-fuel-price").value = 1650;
      document.getElementById("mo-fuel-liters").value = 40;
      document.getElementById("mo-fuel-odo").value = odo;
      document.getElementById("mo-fuel-amount").value = 1650*40;
    }; }
    if(action==="confirm-fuel"){ el.onclick = ()=>{
      const unitPrice = parseFloat(document.getElementById("mo-fuel-price").value)||0;
      const liters = parseFloat(document.getElementById("mo-fuel-liters").value)||0;
      const amount = parseFloat(document.getElementById("mo-fuel-amount").value)||(unitPrice*liters);
      const odometer = parseFloat(document.getElementById("mo-fuel-odo").value)||0;
      if(!liters || !odometer){ showToast("주유량과 주행거리를 입력해주세요."); return; }
      addFuelLog({unitPrice, liters, amount, odometer});
    }; }
    if(action==="open-add-note"){ el.onclick = ()=>{ state.modal={type:"add-note", ctx:"order"}; render(); }; }
    if(action==="open-add-note-profile"){ el.onclick = ()=>{ state.modal={type:"add-note", ctx:"customer"}; render(); }; }
    if(action==="confirm-note"){ el.onclick = async ()=>{
      const content = document.getElementById("mo-note").value.trim();
      if(!content){ showToast("메모 내용을 입력해주세요."); return; }
      let customerId;
      if(state.modal && state.modal.ctx==="customer"){ customerId = state.selectedCustomerId; }
      else { const o = DB.orders.find(x=>x.id===state.selectedOrderId); customerId = o.customerId; }
      const fileInput = document.getElementById("mo-note-photo");
      let photo = null;
      if(fileInput && fileInput.files && fileInput.files[0]){
        try{ photo = await fileToCompressedDataUrl(fileInput.files[0]); }
        catch(e){ console.error("photo compress fail", e); showToast("사진 처리에 실패했습니다. 메모만 저장합니다."); }
      }
      await addCustomerNote(customerId, state.currentUser.name, content, photo);
      state.modal=null; render();
    }; }
    if(action==="view-photo"){ el.onclick = ()=>{ state.modal={type:"photo-view", src: el.dataset.src}; render(); }; }
    if(action==="open-customer-search"){ el.onclick = ()=>{ state.view="customer-search"; state.customerSearchQuery=""; render(); }; }
    if(action==="refresh-data"){ el.onclick = async ()=>{
      showToast("🔄 새로고침 중...", 2000);
      try{
        await loadAllSheets();
        showToast("✅ 최신 데이터로 새로고침했습니다.");
      }catch(e){
        console.warn("새로고침 실패", e);
        showToast(`⚠️ 새로고침에 실패했습니다: ${e.message} (네트워크 상태를 확인하고 다시 시도해주세요)`, 5000);
      }
      render();
    }; }
    if(action==="home-date-today"){ el.onclick = ()=>{ state.selectedDate = todayStr(); render(); }; }
    if(action==="open-import"){ el.onclick = ()=>{ state.importData=null; state.view="import"; render(); }; }
    if(action==="open-import-from-sheet"){ el.onclick = async ()=>{
      if(!DB.config.gsheetUrl){ showToast("먼저 '구글시트 연동 설정'에서 URL을 저장해주세요."); return; }
      showToast("발주요청서 시트를 불러오는 중... (최근 데이터만 가져와서 보통 빨리 끝나요)", 8000);
      try{
        const grid = await gsheetPullSourceGrid();
        if(!grid || !grid.headers || !grid.headers.length){ showToast("시트에서 데이터를 찾지 못했습니다."); return; }
        state.importData = { headers: grid.headers, rows: grid.rows||[], mapping: guessImportMapping(grid.headers), fromSheet:true };
        state.view = "import";
        render();
      }catch(e){
        console.error("pull source sheet fail", e);
        showToast("발주요청서 시트를 불러오지 못했습니다: "+e.message);
      }
    }; }
    if(action==="open-add-item"){ el.onclick = ()=>{ state.modal={type:"item-form"}; render(); }; }
    if(action==="edit-item"){ el.onclick = ()=>{ state.modal={type:"item-form", itemId:el.dataset.id}; render(); }; }
    if(action==="delete-item"){ el.onclick = async ()=>{
      if(!confirm("이 품목을 삭제할까요? 이미 등록된 배송건의 중량에는 영향이 없습니다.")) return;
      await deleteItem(el.dataset.id); render();
    }; }
    if(action==="confirm-item-form"){ el.onclick = async ()=>{
      const name = document.getElementById("mo-item-name").value.trim();
      const qty = parseFloat(document.getElementById("mo-item-qty").value);
      const weight = parseFloat(document.getElementById("mo-item-weight").value);
      if(!name || !qty || !weight){ showToast("품목명, 파레트당 수량, 중량을 모두 입력해주세요."); return; }
      const { recalculated } = await upsertItem(name, qty, weight);
      state.modal=null;
      showToast(`품목이 저장되었습니다.${recalculated?` (진행 중인 배송 ${recalculated}건 중량 재계산)`:""}`);
      render();
    }; }
    if(action==="open-gsheet-sync"){ el.onclick = ()=>{ state.view="gsheet-sync"; render(); }; }
    if(action==="reset-orders"){ el.onclick = async ()=>{
      if(!confirm("정말 배송(orders) 데이터를 전부 초기화할까요?\n\n- 거래처/차량/정비이력/유류 등 다른 데이터는 그대로 유지됩니다.\n- 구글시트 원본(발주요청서)은 그대로 있으니 초기화 후 다시 가져오면 됩니다.\n- 지금까지 앱에서 완료 처리한 이력(완료 리스트)도 같이 사라집니다 (시트 W열 기록은 그대로 남아있어요).")) return;
      DB.orders = [];
      await saveSheet();
      await pushFullReplaceSheet("orders", []); // 이건 의도적인 전체 초기화라, orders 탭만 통째로 비운다
      showToast("배송 데이터를 초기화했습니다. '발주요청서 시트에서 바로 가져오기'로 다시 불러와주세요.");
      render();
    }; }
    if(action==="cancel-import"){ el.onclick = ()=>{ state.importData=null; state.view="admin"; render(); }; }
    if(action==="confirm-import"){ el.onclick = async ()=>{
      const mapping = state.importData.mapping;
      const driverId = document.getElementById("import-driver").value;
      const driver = DB.users.find(u=>u.id===driverId);
      if(mapping.customerName===-1 || mapping.address===-1 || mapping.category===-1 || mapping.qty===-1){
        showToast("거래처명 / 주소 / 품목 / 수량(팩)은 필수로 매칭해주세요."); return;
      }
      // 신규 품목 파레트 정보 먼저 저장
      const newItemInputs = root.querySelectorAll("[data-newitem-qty]");
      for(const inp of newItemInputs){
        const name = inp.dataset.newitemQty;
        const qtyVal = parseFloat(inp.value);
        const weightEl = [...root.querySelectorAll("[data-newitem-weight]")].find(x=>x.dataset.newitemWeight===name);
        const weightVal = weightEl ? parseFloat(weightEl.value) : NaN;
        if(!qtyVal || !weightVal){ showToast(`'${name}' 품목의 파레트당 수량/중량을 입력해주세요.`); return; }
        await upsertItem(name, qtyVal, weightVal);
      }
      const { rows } = state.importData;
      const today = todayStr();
      const { skipDone, dateFilterOn, dateFilterValue } = currentImportFilterOpts();
      const targetRows = filterImportRows(rows, mapping, {skipDone, dateFilterOn, dateFilterValue});
      const skippedTotal = rows.length - targetRows.length;
      // No.(원본 시트 행 번호)를 진짜 식별자로 쓴다 — 날짜/수량 등 내용이 바뀌어도 같은 No.면
      // 같은 건으로 보고 내용만 갱신한다 (예전엔 이름+품목+수량+날짜 조합이라 날짜가 바뀌면
      // 다른 건으로 착각해 예전 것은 유령처럼 남고 중복이 생겼었다).
      const existingBySourceNo = new Map(DB.orders.filter(o=>o.sourceNo).map(o=>[o.sourceNo, o]));
      const existingBySourceKey = new Map(DB.orders.filter(o=>o.sourceKey).map(o=>[o.sourceKey, o])); // No. 없는 레거시 건 보조 매칭
      let newCustomers=0, newOrders=0, dupSkipped=0, reassigned=0, updated=0;
      const touchedOrders = []; // 새로 만들었거나 내용이 바뀐 주문들 — 이것만 서버에 콕 집어 반영
      const newCustomerRecords = [];
      for(const r of targetRows){
        const name = (r[mapping.customerName]||"").toString().trim();
        const address = (r[mapping.address]||"").toString().trim();
        const category = (r[mapping.category]||"").toString().trim();
        const qtyText = (r[mapping.qty]||"").toString().trim();
        const normRequestDate = mapping.requestDate>-1 ? normalizeDateStr(r[mapping.requestDate]) : null;
        const normDueDate = mapping.dueDate>-1 ? normalizeDateStr(r[mapping.dueDate]) : null;
        const orderDate = normDueDate || today; // 배송리스트는 납품예정일자 기준으로 표시
        const sourceKey = importSourceKey(name, category, qtyText, orderDate);
        const driverIds = mapping.driverAssign>-1
          ? resolveDriverIdsFromRaw(r[mapping.driverAssign])
          : [driver.id];
        const sourceNo = mapping.sourceNo>-1 ? (r[mapping.sourceNo]||"").toString().trim() : "";
        const existing = (sourceNo && existingBySourceNo.get(sourceNo)) || existingBySourceKey.get(sourceKey);
        // 배정된 기사 중 이미 오늘 운행을 시작한 사람이 있으면 대기로 두지 않고 배송중으로 맞춘다.
        const shouldBeInTransit = orderDate===today && anyDriverHasActiveTrip(driverIds);
        if(existing){
          // 완료 계열(완료/상차완료) 건이라도 "담당자"와 "완료 여부"는 결과 기록이라 얼려두지만,
          // 날짜/수량/품목/중량은 시트에서 나중에 고쳐질 수 있는 정보라 완료 후에도 계속 따라간다.
          let changed = false;
          if(!isDoneStatus(existing.status)){
            if(mapping.driverAssign>-1 && !sameDriverIds(existing.driverIds, driverIds)){ existing.driverIds = driverIds; reassigned++; changed=true; }
            if(existing.status==="대기" && shouldBeInTransit){ existing.status = "배송중"; changed=true; }
          }
          if(existing.category!==category){ existing.category = category; changed=true; }
          if(existing.qty!==qtyText){ existing.qty = qtyText; changed=true; }
          if(existing.dueDate!==orderDate){ existing.dueDate = orderDate; changed=true; }
          if(existing.date!==orderDate){ existing.date = orderDate; changed=true; }
          if(normRequestDate && existing.requestDate!==normRequestDate){ existing.requestDate = normRequestDate; changed=true; }
          const newWeight = computeOrderWeight(category, qtyText);
          if(existing.totalWeightKg!==newWeight){ existing.totalWeightKg = newWeight; changed=true; }
          if(existing.sourceKey!==sourceKey) existing.sourceKey = sourceKey;
          if(changed){ updated++; touchedOrders.push(existing); } else dupSkipped++;
          if(!existing.sourceNo && sourceNo){ existing.sourceNo = sourceNo; existingBySourceNo.set(sourceNo, existing); if(!touchedOrders.includes(existing)) touchedOrders.push(existing); }
          continue;
        }
        let c = DB.customers.find(x=>x.name.trim()===name);
        if(!c){
          c = { id:uid("cust"), name, type:(mapping.type>-1 ? (r[mapping.type]||"납품").toString().trim() : "납품"),
            address, phone: mapping.phone>-1 ? (r[mapping.phone]||"").toString().trim() : "", notes:[] };
          DB.customers.push(c); newCustomers++; newCustomerRecords.push(c);
        }
        const order = {
          id: uid("order"), customerId: c.id,
          category,
          qty: qtyText,
          totalWeightKg: computeOrderWeight(category, qtyText),
          requestDate: normRequestDate || today,
          dueDate: normDueDate || today,
          completedDate: null, status: shouldBeInTransit ? "배송중" : "대기",
          driverIds, vehicleNo: driver.vehicleNo, date: orderDate, sourceKey, sourceNo,
        };
        DB.orders.push(order); newOrders++;
        touchedOrders.push(order);
        existingBySourceKey.set(sourceKey, order);
        if(sourceNo) existingBySourceNo.set(sourceNo, order);
      }
      // 구글시트에서 직접 가져온 경우에만 "시트에서 사라진 건" 정리를 적용한다.
      // 수동 업로드 파일은 일부만 담긴 목록일 수 있어서, 거기 없다고 삭제하면 위험하다.
      let removed = 0;
      const removedOrderIds = [];
      if(state.importData.fromSheet && mapping.sourceNo>-1){
        const allSourceNos = new Set(rows.map(r=>(r[mapping.sourceNo]||"").toString().trim()).filter(Boolean));
        const before = DB.orders.length;
        DB.orders = DB.orders.filter(o=>{
          if(isDoneStatus(o.status) || !o.sourceNo) return true;
          const keep = allSourceNos.has(o.sourceNo);
          if(!keep) removedOrderIds.push(o.id);
          return keep;
        });
        removed = before - DB.orders.length;
      }
      await saveSheet();
      if(touchedOrders.length) await pushUpsertRecords("orders", touchedOrders);
      if(newCustomerRecords.length) await pushUpsertRecords("customers", newCustomerRecords);
      if(removedOrderIds.length) await pushDeleteRecords("orders", removedOrderIds);
      state.importData = null; state.view="admin";
      showToast(`가져오기 완료: 거래처 ${newCustomers}건 추가, 배송 ${newOrders}건 등록${reassigned?` · ${reassigned}건 담당자 재배정`:""}${updated?` · ${updated}건 내용 변경 반영`:""}${removed?` · 시트에서 사라진 건 ${removed}건 정리`:""}${skippedTotal?` · ${skippedTotal}건 건너뜀(필터 조건에 안 맞음)`:""}${dupSkipped?` · ${dupSkipped}건 변경없음`:""}`);
      render();
    }; }
    if(action==="save-gsheet-url"){ el.onclick = async ()=>{
      DB.config.gsheetUrl = document.getElementById("gsheet-url").value.trim();
      await saveSheet();
      showToast("URL이 저장되었습니다.");
    }; }
    if(action==="gsheet-pull"){ el.onclick = async ()=>{ await gsheetPull(); }; }
    if(action==="gsheet-push"){ el.onclick = async ()=>{ await gsheetPush(); }; }
    if(action==="open-customer"){ el.onclick = ()=>{ state.selectedCustomerId = el.dataset.id; state.view="customer-profile"; render(); }; }
    if(action==="open-add-maint"){ el.onclick = async ()=>{ state.modal={type:"add-maint"}; await render();
      const odo = await currentOdometer(state.currentUser.vehicleNo);
      document.getElementById("mo-maint-odo").value = odo;
    }; }
    if(action==="confirm-maint"){ el.onclick = ()=>{
      const part = document.getElementById("mo-maint-part").value;
      const odometer = parseFloat(document.getElementById("mo-maint-odo").value);
      const intervalKm = parseFloat(document.getElementById("mo-maint-interval").value)||10000;
      const memo = document.getElementById("mo-maint-memo").value;
      if(!odometer){ showToast("교체 시점 주행거리를 입력해주세요."); return; }
      addMaintLog({part, odometer, intervalKm, memo});
    }; }
    if(action==="open-edit-order"){ el.onclick = ()=>{ state.modal={type:"edit-order"}; render(); }; }
    if(action==="close-modal"){ el.onclick = ()=>{ state.modal=null; render(); }; }
    if(action==="backdrop"){ el.onclick = (e)=>{ if(e.target===el){ state.modal=null; render(); } }; }
    if(action==="set-status"){ el.onclick = ()=>{ setOrderStatus(state.selectedOrderId, el.dataset.status); }; }
  });

  const vsel = document.getElementById("maint-vehicle-select");
  if(vsel){ vsel.onchange = ()=>{ state._adminMaintVehicle = vsel.value; render(); }; }

  root.querySelectorAll("[data-mapfield]").forEach(sel=>{
    sel.onchange = ()=>{
      if(!state.importData) return;
      state.importData.mapping[sel.dataset.mapfield] = parseInt(sel.value,10);
      render();
    };
  });

  const importSkipDone = document.getElementById("import-skip-done");
  if(importSkipDone){ importSkipDone.onchange = ()=>{ state.importData.skipDone = importSkipDone.checked; render(); }; }
  const importDateFilterOn = document.getElementById("import-date-filter-on");
  if(importDateFilterOn){ importDateFilterOn.onchange = ()=>{ state.importData.dateFilterOn = importDateFilterOn.checked; render(); }; }
  const importDateFilterValue = document.getElementById("import-date-filter-value");
  if(importDateFilterValue){ importDateFilterValue.onchange = ()=>{ if(importDateFilterValue.value){ state.importData.dateFilterValue = importDateFilterValue.value; render(); } }; }

  const importFileInput = document.getElementById("import-file-input");
  if(importFileInput){
    importFileInput.onchange = async ()=>{
      const f = importFileInput.files[0];
      if(!f) return;
      try{
        const buf = await f.arrayBuffer();
        const wb = XLSX.read(new Uint8Array(buf), {type:"array"});
        const ws = wb.Sheets[wb.SheetNames[0]];
        const grid = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false});
        if(!grid.length){ showToast("파일에서 데이터를 찾지 못했습니다."); return; }
        const headers = grid[0].map(h=>(h||"").toString());
        const rows = grid.slice(1).filter(r=> r.some(c=>c!==""));
        state.importData = { headers, rows, mapping: guessImportMapping(headers) };
        render();
      }catch(e){
        console.error("import parse fail", e);
        showToast("파일을 읽는 데 실패했습니다. 엑셀(.xlsx) 또는 CSV 파일인지 확인해주세요.");
      }
    };
  }

  const homeDatePicker = document.getElementById("home-date-picker");
  if(homeDatePicker){
    homeDatePicker.onchange = ()=>{
      if(homeDatePicker.value){ state.selectedDate = homeDatePicker.value; render(); }
    };
  }

  const notePhotoInput = document.getElementById("mo-note-photo");
  if(notePhotoInput){
    notePhotoInput.onchange = ()=>{
      const preview = document.getElementById("mo-note-photo-preview");
      const f = notePhotoInput.files[0];
      if(!f){ preview.innerHTML=""; return; }
      const url = URL.createObjectURL(f);
      preview.innerHTML = `<img src="${url}" style="max-width:100%;max-height:140px;border-radius:9px;margin-top:8px;border:1px solid var(--line);"/>`;
    };
  }

  const searchInput = document.getElementById("customer-search-input");
  if(searchInput){
    searchInput.oninput = ()=>{
      state.customerSearchQuery = searchInput.value;
      const q = searchInput.value.trim().toLowerCase();
      const all = DB.customers;
      const filtered = q ? all.filter(c=> c.name.toLowerCase().includes(q) || c.address.toLowerCase().includes(q)) : all.slice();
      filtered.sort((a,b)=>a.name.localeCompare(b.name,"ko"));
      const container = document.getElementById("customer-search-results");
      container.innerHTML = filtered.map(customerCardHtml).join("") || `<div class="empty">검색 결과가 없습니다.</div>`;
      container.querySelectorAll('[data-action="open-customer"]').forEach(elx=>{
        elx.onclick = ()=>{ state.selectedCustomerId = elx.dataset.id; state.view="customer-profile"; render(); };
      });
    };
  }

  startTripClock();
}

function setupFuelAutoCalc(){
  const price = document.getElementById("mo-fuel-price");
  const liters = document.getElementById("mo-fuel-liters");
  const amount = document.getElementById("mo-fuel-amount");
  function calc(){
    const p = parseFloat(price.value), l = parseFloat(liters.value);
    if(p && l) amount.value = Math.round(p*l);
  }
  if(price) price.oninput = calc;
  if(liters) liters.oninput = calc;
}

/* live trip clock */
let clockInterval = null;
function startTripClock(){
  clearInterval(clockInterval);
  const el = document.getElementById("trip-clock");
  const wrap = root.querySelector(".trip-timer[data-trip-start]");
  if(!el || !wrap) return;
  const start = new Date(wrap.dataset.tripStart).getTime();
  function tick(){
    const diff = Math.max(0, Date.now()-start);
    const h = Math.floor(diff/3600000), m = Math.floor(diff%3600000/60000), s = Math.floor(diff%60000/1000);
    el.textContent = `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
  }
  tick();
  clockInterval = setInterval(tick, 1000);
}

/* ---------------- boot ---------------- */
(async function boot(){
  try{
    await seedIfNeeded();
  }catch(e){ console.error("seed error", e); }

  // 새로고침해도 로그인 화면으로 튕기지 않도록, 이 브라우저에 저장된 세션이 있으면 복원한다.
  const session = loadSession();
  if(session && session.userId){
    const u = await getUser(session.userId);
    if(u){
      state.currentUser = { ...u };
      if(session.vehicleNo) state.currentUser.vehicleNo = session.vehicleNo;
      state.view = (u.role??"").toString().trim()==="admin" ? "admin" : "home";
      state.navTab = state.view;
      render();
      await checkMaintAlerts(state.currentUser);
      if((u.role??"").toString().trim()==="driver") await runDriverAutoSync();
      return;
    }
    clearSession(); // 세션에 저장된 계정이 더 이상 존재하지 않으면 정리하고 로그인 화면으로
  }
  render();
})();
</script>
